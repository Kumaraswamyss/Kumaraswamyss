name: Generate Datas

on:
  schedule:
    # execute every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      # Snake Animation - Updated to v3
      - id: snake-gif
        uses: Platane/snk@v3
        with:
          github_user_name: kumaraswamyss
          svg_out_path: dist/github-contribution-grid-snake.svg

      # GitHub Pages Deploy - Updated to v4
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
